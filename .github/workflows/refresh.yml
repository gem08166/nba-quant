name: refresh-and-deploy

on:
  schedule:
    # UTC 02:00 / 08:00 = 北京时间 10:00 / 16:00
    - cron: "0 2,8 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  # 数据源与推送的密钥（Settings → Secrets and variables → Actions 配置；
  # 未配置时对应源自动跳过，不报错）
  NBAQ_ODDS_API_KEY: ${{ secrets.NBAQ_ODDS_API_KEY }}
  HOOPS_API_KEY: ${{ secrets.HOOPS_API_KEY }}
  NBAQ_NTFY_TOPIC: ${{ secrets.NBAQ_NTFY_TOPIC }}
  NBAQ_WEBDAV_USER: ${{ secrets.NBAQ_WEBDAV_USER }}
  NBAQ_WEBDAV_PASS: ${{ secrets.NBAQ_WEBDAV_PASS }}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # SQLite 不再进 main：每次从独立 data 分支取回，跑完再覆盖回去。
      - name: Restore database from data branch
        run: |
          mkdir -p data
          if git fetch origin data --depth=1 2>/dev/null; then
            git show origin/data:nba.db > data/nba.db
            echo "restored data/nba.db from origin/data"
          else
            echo "no data branch; falling back to data/nba.db in the repo if present"
          fi
          if [ ! -s data/nba.db ]; then
            echo "::error::no database available. Seed the data branch once (see README / CONTEXT.md)."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run tests
        run: |
          set -o pipefail
          if ! python -m pytest -q 2>&1 | tee pytest.log; then
            # 把 FAILED/ERROR 行与日志尾部作为 annotation 暴露（无 token 也能在 checks API 看到）
            grep -E "^(FAILED|ERROR)" pytest.log | while IFS= read -r line; do
              echo "::error title=pytest::$line"
            done
            tail -n 30 pytest.log | while IFS= read -r line; do
              echo "::error title=pytest-log::$(printf '%s' "$line" | cut -c1-220)"
            done
            exit 1
          fi

      - name: Compute slate date
        id: slate
        run: echo "slate=$(python -c 'from app.dates import current_slate_date; print(current_slate_date())')" >> "$GITHUB_OUTPUT"

      # 合并云端台账 + 应用删除墓碑（用户清空/删除的注单不能在导出时复活）。
      # pull_only：只拉不推，避免每天两次的 full run 覆盖云端台账。
      - name: Merge cloud ledger + apply deletions
        run: python -m app.cli bets-sync --pull-only || true

      # 先抓齐所有盘口（ESPN + 第二书源），再训练/预测：
      # 旧顺序在抓第二书源之前 predict，导致共识只能看到 ESPN 一家。
      - name: Ingest games + odds
        run: |
          python -m app.cli ingest --date ${{ steps.slate.outputs.slate }}
          python -m app.cli hao-odds --date ${{ steps.slate.outputs.slate }} || true
          python -m app.cli odds-api --date ${{ steps.slate.outputs.slate }} || true
          python -m app.cli hoops-sync || true

      - name: Train + predict
        run: |
          python -m app.cli train
          python -m app.cli predict --date ${{ steps.slate.outputs.slate }}

      - name: Settle + closing
        run: |
          python -m app.cli closing || true
          python -m app.cli settle || true

      # 信号日志历史回填（幂等）：把 predictions.details 里的旧信号补进 signal_log。
      # 轻量 tick 只记新信号，历史部分每天在这里补齐一次。
      - name: Backfill signal log (idempotent)
        run: python -m scripts.backfill_signal_log || true

      - name: PBP backfill + RAPM
        run: |
          D=$(python -c "from app.dates import current_slate_date as d; from datetime import date, timedelta; x=date.fromisoformat(d()); print((x-timedelta(days=2)).isoformat())")
          E=$(python -c "from app.dates import current_slate_date as d; from datetime import date, timedelta; x=date.fromisoformat(d()); print((x-timedelta(days=1)).isoformat())")
          python -m scripts.backfill_pbp --start "$D" --end "$E" --quiet || true
          python -m app.cli rapm-train || true

      - name: Backtest
        run: python -m app.cli backtest --test-start 2026-01-01 || true

      - name: Frozen holdout eval (70/30 temporal split)
        run: python -m app.cli holdout --split 0.7 || true

      - name: MARKET_BLEND sweep (freeze the selection-quality baseline)
        run: python -m scripts.blend_sweep || true

      - name: Model vs closing-line report
        run: python -m scripts.model_clv_history --start 2025-10-21 || true

      - name: Signal → line-move gate report
        run: python -m scripts.linemove_analysis || true

      - name: In-game win probability calibration (research, no signals)
        run: python -m scripts.live_wp_fit || true

      - name: Export static site
        run: python -m scripts.export_static --out site

      # 关键：Pages artifact 在本 job 内、用本 run 刚生成的 site/ 上传。
      # deploy job 不再 checkout（旧写法拿到的是触发 SHA，永远部署上一轮数据）。
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 静态站不再回提交 main：2026-11-07 起 site/ 与抓取状态都进了 .gitignore，
      # 发布只走 Pages artifact（下面 deploy job）→ gh-pages。
      # 旧步骤 `git add site data/odds_api_state.json ...` 会因 ignored path 直接失败，
      # 导致后面的 data 分支快照整步被跳过（2026-11-07 01:22Z 的失败即此）。

      # 数据库以单 commit 快照推到 data 分支（每次 force，历史不增长）。
      - name: Persist database to data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python -c "import sqlite3; c=sqlite3.connect('data/nba.db'); c.execute('PRAGMA wal_checkpoint(TRUNCATE)'); c.close()"
          rm -rf "$RUNNER_TEMP/db-repo"
          mkdir -p "$RUNNER_TEMP/db-repo"
          cp data/nba.db "$RUNNER_TEMP/db-repo/nba.db"
          python -m app.cli bets-export --out "$RUNNER_TEMP/db-repo/bets.json"
          cd "$RUNNER_TEMP/db-repo"
          git init -q
          git checkout -q -b data
          git add nba.db bets.json
          git -c user.name="nba-quant-bot" -c user.email="nba-quant@users.noreply.github.com" \
            commit -q -m "db snapshot: ${{ steps.slate.outputs.slate }}"
          git push -q --force \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    # Pages 部署全局串行（与 odds-refresh-light 共用一把锁）
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # artifact 由 refresh job 上传，deploy job 直接发布同一个 run 的产物。
      - id: deployment
        uses: actions/deploy-pages@v4
