[project]
name = "nba-quant"
version = "0.1.0"
description = "Personal pregame NBA quant research tool (free data sources, PWA-ready)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nbaq = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 排除坚果云同步产生的「冲突-xxx_Win10」副本文件（不带 test_ 前缀的会被
# python_files 挡掉，但这个文件名以 test_ 开头，需要显式 ignore）
ignore = ["tests/*-冲突-*_Win10.py"]
