[project]
name = "nba-quant"
version = "0.1.0"
description = "Personal pregame NBA quant research tool (free data sources, PWA-ready)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
nbaq = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# 坚果云同步产生的「冲突-xxx_Win10」副本在 tests/conftest.py 里用
# collect_ignore_glob 排除（`ignore` 不是 pytest 的合法配置项）。
